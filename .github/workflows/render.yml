name: Render resume

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    name: Build PDF
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make latexmk poppler-utils \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended

      - name: Build and verify PDF (must be exactly two pages)
        run: make verify

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: build/resume.pdf
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: render
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: dist

      - name: Create release with versioned PDF
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mv dist/resume.pdf "dist/resume-${TAG}.pdf"
          gh release create "${TAG}" "dist/resume-${TAG}.pdf" \
            --title "Resume ${TAG}" --generate-notes
